<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ayet & Hadis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
  
  <style>
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; touch-action: pan-y; }
    .font-arabic { font-family: 'Amiri', serif; }
    .bg-overlay { background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.45) 50%, rgba(0,0,0,0.85) 100%); }
    
    .card-anim {
      transition: transform 0.35s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.35s ease;
    }
    .slide-up-out {
      transform: translateY(-80px);
      opacity: 0;
    }
    .slide-up-in {
      transform: translateY(80px);
      opacity: 0;
    }

    @keyframes heartPop {
      0% { transform: scale(0) translate(-50%, -50%); opacity: 0; }
      50% { transform: scale(1.2) translate(-50%, -50%); opacity: 1; }
      100% { transform: scale(1) translate(-50%, -50%); opacity: 0; }
    }
    .heart-animation {
      position: absolute; top: 50%; left: 50%;
      transform-origin: 0 0;
      animation: heartPop 0.8s ease-out forwards;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden select-none">

  <!-- Arka Plan Görseli -->
  <div id="bg-image" class="absolute inset-0 bg-cover bg-center transition-all duration-1000 scale-105" 
       style="background-image: url('https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000');">
  </div>
  
  <!-- Gölgelendirme Katmanı -->
  <div class="absolute inset-0 bg-overlay"></div>

  <!-- Bismillah Animasyon Alanı -->
  <div id="anim-container" class="absolute inset-0 pointer-events-none z-50"></div>

  <!-- Sağ Yan Aksiyon Menüsü (Beğen & Kaydet) -->
  <div class="absolute right-4 bottom-28 z-30 flex flex-col items-center space-y-6">
    <!-- Beğen Butonu -->
    <button id="like-btn" onclick="toggleLike(event)" class="flex flex-col items-center space-y-1 group focus:outline-none">
      <div id="like-bg" class="p-3 bg-black/40 backdrop-blur-md rounded-full border border-white/10 text-white group-active:scale-125 transition-all">
        <svg id="heart-icon" class="w-6 h-6 fill-none stroke-current stroke-2 transition-colors" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />
        </svg>
      </div>
      <span class="text-[10px] font-semibold text-white/80 drop-shadow">Beğen</span>
    </button>

    <!-- Kaydet Butonu -->
    <button id="save-btn" onclick="toggleSave(event)" class="flex flex-col items-center space-y-1 group focus:outline-none">
      <div id="save-bg" class="p-3 bg-black/40 backdrop-blur-md rounded-full border border-white/10 text-white group-active:scale-125 transition-all">
        <svg id="bookmark-icon" class="w-6 h-6 fill-none stroke-current stroke-2 transition-colors" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
        </svg>
      </div>
      <span class="text-[10px] font-semibold text-white/80 drop-shadow">Kaydet</span>
    </button>
  </div>

  <!-- Ana Kart Konteyner -->
  <div id="app" class="relative z-10 h-full w-full flex flex-col justify-between p-6 max-w-md mx-auto">
    
    <!-- Üst Başlık -->
    <div class="text-center pt-8">
      <span class="bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-semibold tracking-widest uppercase border border-white/10 text-amber-300">
        Günün Hikmeti
      </span>
    </div>

    <!-- Orta Alan (Animasyonlu Kart) -->
    <div id="card-content" class="card-anim my-auto text-center space-y-6 px-2 pr-10">
      <p id="arabic-text" class="font-arabic text-2xl md:text-3xl text-amber-200 leading-relaxed dir-rtl">
        Yükleniyor...
      </p>
      
      <p id="turkish-text" class="text-lg md:text-xl font-medium text-white/95 leading-snug">
        Veriler getiriliyor, lütfen bekleyin...
      </p>
    </div>

    <!-- Alt Alan: Kaynak ve Bilgi -->
    <div class="pb-10 text-center space-y-3">
      <div id="source-text" class="text-sm font-semibold text-white/75 bg-black/30 backdrop-blur-sm py-1.5 px-4 rounded-lg inline-block border border-white/5">
        -
      </div>
      <p class="text-[10px] text-white/40 tracking-wider">Sonraki için yukarı kaydırın • Çift tıkla</p>
    </div>

  </div>
