<!DOCTYPE html>
<html lang="tr">
<head>

  <title>Ayet & Hadis</title>
  <link rel="manifest" href="./manifest.json" />

  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  
  <style>
    html, body {
      touch-action: none;
      overscroll-behavior: none;
      overflow: hidden;
      height: 100%;
      width: 100%;
    }
    body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
    .font-arabic { font-family: 'Amiri', serif; }
    .bg-overlay { background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.45) 50%, rgba(0,0,0,0.85) 100%); }
    
    #card-content {
      will-change: transform, opacity;
      transform-style: preserve-3d;
      backface-visibility: hidden;
    }

    @keyframes heartPop {
      0% { transform: scale(0) translate(-50%, -50%); opacity: 0; }
      50% { transform: scale(1.2) translate(-50%, -50%); opacity: 1; }
      100% { transform: scale(1) translate(-50%, -50%); opacity: 0; }
    }
    .heart-animation {
      position: absolute; top: 50%; left: 50%;
      transform-origin: 0 0;
      animation: heartPop 0.8s ease-out forwards;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white h-screen w-screen overflow-hidden select-none">

  <!-- Arka Plan Görseli -->

        </svg>

      <p class="text-[10px] text-white/40 tracking-wider">Yukarı kaydırın • Çift tıkla</p>
    </div>

  </div>

    ];

    var dataset = [];
    var deck = [];
    var isLiked = false;
    var isSaved = false;
    var lastBgIndex = -1;

    async function loadData() {
      try {
        var response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("veri.csv dosyası okunamadı!");
        var csvText = await response.text();
        
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: true,
          complete: function(results) {
            dataset = results.data;
            if (dataset && dataset.length > 0) {
              rebuildDeck();
              renderContent();
            } else {
              document.getElementById('turkish-text').innerText = "veri.csv dosyası boş veya okunamıyor.";
            }
          }
        });
      } catch (error) {
        document.getElementById('arabic-text').innerText = "";
        document.getElementById('turkish-text').innerText = error.message;
      }
    }
