<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ayet & Hadis</title>
  <link rel="manifest" href="./manifest.json" />
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    .font-arabic { font-family: 'Amiri', serif; }
    
    /* Thunkable PageViewer & Scroll Snap Motoru */
    .thunkable-container {
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      height: 100vh;
      width: 100vw;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .thunkable-container::-webkit-scrollbar { display: none; }

    .thunkable-card {
      scroll-snap-align: start;
      scroll-snap-stop: always;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .bg-overlay { background: linear-gradient(180deg, rgba(0,0,0,0.65) 0%, rgba(0,0,0,0.45) 50%, rgba(0,0,0,0.85) 100%); }

    @keyframes heartPop {
      0% { transform: scale(0) translate(-50%, -50%); opacity: 0; }
      50% { transform: scale(1.2) translate(-50%, -50%); opacity: 1; }
      100% { transform: scale(1) translate(-50%, -50%); opacity: 0; }
    }
    .heart-animation {
      position: absolute; top: 50%; left: 50%;
      transform-origin: 0 0;
      animation: heartPop 0.8s ease-out forwards;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white select-none">

  <!-- Thunkable Ana Ekran Konteyneri -->
  <div id="feed" class="thunkable-container">
    <div id="loading-screen" class="h-screen w-screen flex flex-col items-center justify-center text-center p-6 text-amber-200">
      <div class="w-10 h-10 border-4 border-amber-300 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-sm font-medium tracking-wide">Ayet havuzu yükleniyor...</p>
    </div>
  </div>

  <div id="anim-container" class="fixed inset-0 pointer-events-none z-50"></div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(function() {});
    }

    var CSV_URL = "./veri.csv?cachebust=" + new Date().getTime(); 

    var BG_IMAGES = [
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000",
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1000",
      "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1000",
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1000",

      "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1000",
      "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000",
      "https://images.unsplash.com/photo-1505118380757-91f5f5632de0?q=80&w=1000"
    ];

    var dataset = [];
    var deck = [];
    var lastBgIndex = -1;
    var feedEl = document.getElementById('feed');
    var isInitialLoaded = false;

    async function loadData() {
      try {
        var response = await fetch(CSV_URL);
        if (!response.ok) {
          throw new Error("veri.csv bulunamadı. GitHub deponuzda 'veri.csv' adında dosya olduğundan emin olun.");
        }
        
        var csvText = await response.text();
        
        // CSV ayrıştırma
        Papa.parse(csvText, {
          header: true,
          skipEmptyLines: 'greedy',
          complete: function(results) {
            dataset = (results.data || []).filter(function(row) {
              return Object.values(row).some(function(v) { return v !== null && v !== "" && v !== undefined; });
            });

            if (dataset && dataset.length > 0) {
              rebuildDeck();
              var loader = document.getElementById('loading-screen');
              if (loader) loader.remove();
              
              var count = Math.min(6, dataset.length);
              for (var i = 0; i < count; i++) {
                appendCard();
              }
              isInitialLoaded = true;
            } else {
              showError("veri.csv yüklendi ancak içerisinde okunabilir satır bulunamadı.");
            }
          }
        });
      } catch (error) {
        showError(error.message);
      }
    }

    function showError(msg) {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.innerHTML = 
          "<div class='p-5 bg-red-950/90 rounded-2xl border border-red-500/40 max-w-xs text-center'>" +
          "<p class='text-red-400 font-bold text-sm mb-2'>Veri Yükleme Hatası</p>" +
          "<p class='text-xs text-white/80 leading-relaxed font-mono mb-3'>" + msg + "</p>" +
          "<p class='text-[10px] text-amber-300/80'>Deponuzdaki dosya adının 'veri.csv' olduğundan emin olun.</p>" +
          "</div>";
      }
    }

    // Esnek Sütun Ayrıştırıcı (Thunkable Data Source Mantığı)
    function extractRowData(item) {
      if (!item) return { arabic: '', turkish: '', sure: '', ayet: '', kaynak: '' };

      var keys = Object.keys(item);
      
      // Noktalı virgül (;) koruması
      if (keys.length === 1 && keys[0].indexOf(';') !== -1) {
        var headers = keys[0].split(';');
        var values = (item[keys[0]] || '').toString().split(';');
        item = {};
        for (var h = 0; h < headers.length; h++) {
          item[headers[h].trim()] = values[h] ? values[h].trim() : '';
        }
        keys = Object.keys(item);
      }

      var arabic = '', turkish = '', sure = '', ayet = '', kaynak = '';

      // Bilinen sütun isimleri
      arabic = item['Arapça Yazi'] || item['Arapca Yazi'] || item['Arapça'] || item['Arapca'] || item['Arabic'] || '';
      turkish = item['Türkçe Yazı'] || item['Türkçe Yazi'] || item['Turkce Yazi'] || item['Icerik'] || item['Meal'] || item['Turkish'] || item['Metin'] || '';
      sure = item['Sure İsmi'] || item['Sure Ismi'] || item['Sure'] || item['Surah'] || '';
      ayet = item['Ayet Numarası'] || item['Sure numarası'] || item['Ayet No'] || item['Ayet'] || item['Verse'] || '';
      kaynak = item['Kaynak'] || item['Source'] || '';

      // Eğer eşleşmediyse içeriğe göre tespit et
      if (!arabic || !turkish) {
        for (var i = 0; i < keys.length; i++) {
          var val = (item[keys[i]] || '').toString().trim();
          if (!val) continue;
          if (!arabic && /[\u0600-\u06FF]/.test(val)) {
            arabic = val;
          } else if (!turkish && val.length > 3 && val !== arabic) {
            turkish = val;
          }
        }
      }
      return { arabic: arabic, turkish: turkish, sure: sure, ayet: ayet, kaynak: kaynak };
    }

    function rebuildDeck() {
      deck = [];
      for (var i = 0; i < dataset.length; i++) deck.push(i);
      for (var j = deck.length - 1; j > 0; j--) {
        var r = Math.floor(Math.random() * (j + 1));
        var temp = deck[j];
        deck[j] = deck[r];
        deck[r] = temp;
      }
    }

    function getNextItem() {
      if (deck.length === 0) rebuildDeck();
      var index = deck.pop();
      return dataset[index];
    }
