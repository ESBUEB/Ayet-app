<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Ayet & Hadis</title>
  <meta name="theme-color" content="#000000" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
  
  <style>
    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #000;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    .font-arabic { 
      font-family: 'Amiri', serif; 
      direction: rtl !important;
      unicode-bidi: isolate;
      text-align: center;
    }
    
    .snap-container {
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      height: 100vh;
      width: 100vw;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .snap-container::-webkit-scrollbar { display: none; }

    .snap-card {
      scroll-snap-align: start;
      scroll-snap-stop: always;
      height: 100vh;
      width: 100vw;
      position: relative;
    }

    .bg-overlay { background: linear-gradient(180deg, rgba(0,0,0,0.75) 0%, rgba(0,0,0,0.5) 50%, rgba(0,0,0,0.85) 100%); }

    @keyframes heartPop {
      0% { transform: scale(0) translate(-50%, -50%); opacity: 0; }
      50% { transform: scale(1.2) translate(-50%, -50%); opacity: 1; }
      100% { transform: scale(1) translate(-50%, -50%); opacity: 0; }
    }
    .heart-animation {
      position: absolute; top: 50%; left: 50%;
      transform-origin: 0 0;
      animation: heartPop 0.8s ease-out forwards;
      pointer-events: none;
    }
  </style>
</head>
<body class="bg-black text-white select-none">

  <!-- Üst Bar: Sayaç & Kaydedilenler -->
  <div class="fixed top-0 left-0 right-0 z-40 flex items-center justify-between p-4 max-w-md mx-auto pointer-events-auto">
    <div class="bg-black/50 backdrop-blur-md px-3 py-1.5 rounded-full border border-white/10 text-xs font-semibold text-amber-300 flex items-center space-x-1.5 shadow-lg">
      <svg class="w-4 h-4 text-amber-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
      </svg>
      <span>Okunan: <strong id="read-counter" class="text-white">0</strong></span>
    </div>

    <button onclick="openSavedModal()" class="bg-black/50 backdrop-blur-md px-3.5 py-1.5 rounded-full border border-white/10 text-xs font-semibold text-amber-300 flex items-center space-x-1.5 active:scale-95 transition-all shadow-lg">
      <svg class="w-4 h-4 fill-amber-400 stroke-none" viewBox="0 0 24 24">
        <path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
      </svg>
      <span>Kaydedilenler</span>
      <span id="saved-count-badge" class="bg-amber-400 text-black text-[10px] px-1.5 py-0.2 rounded-full font-bold ml-1">0</span>
    </button>
  </div>

  <!-- Scroll Snap Konteyneri -->
  <div id="feed" class="snap-container">
    <div id="loading-screen" class="h-screen w-screen flex flex-col items-center justify-center text-center p-6 text-amber-200">
      <div class="w-10 h-10 border-4 border-amber-300 border-t-transparent rounded-full animate-spin mb-4"></div>
      <p class="text-sm font-medium tracking-wide">Ayetler hazırlanıyor...</p>
    </div>
  </div>

  <div id="anim-container" class="fixed inset-0 pointer-events-none z-50"></div>

  <!-- Kaydedilenler Modal -->
  <div id="saved-modal" class="fixed inset-0 z-50 bg-black/85 backdrop-blur-lg hidden flex flex-col max-w-md mx-auto transition-opacity duration-300 opacity-0">
    <div class="p-5 border-b border-white/10 flex items-center justify-between bg-black/60">
      <div class="flex items-center space-x-2">
        <svg class="w-5 h-5 fill-amber-400" viewBox="0 0 24 24">
          <path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />
        </svg>
        <h2 class="text-lg font-bold text-amber-300 tracking-wide">Kaydedilen Ayetler</h2>
      </div>
      <button onclick="closeSavedModal()" class="p-2 bg-white/10 rounded-full text-white/80 active:scale-95 transition-all">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
        </svg>
      </button>
    </div>
    <div id="saved-list" class="flex-1 overflow-y-auto p-4 space-y-4"></div>
  </div>

  <script>
    // 1. Service Worker önbellek kilitlenmesini anında temizle
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) { reg.unregister(); }
      }).catch(function() {});
    }

    var CSV_URL = "./veri.csv?t=" + new Date().getTime(); 

    var BG_IMAGES = [
      "https://images.unsplash.com/photo-1507525428034-b723cf961d3e?q=80&w=1000",
      "https://images.unsplash.com/photo-1464822759023-fed622ff2c3b?q=80&w=1000",
      "https://images.unsplash.com/photo-1519681393784-d120267933ba?q=80&w=1000",
      "https://images.unsplash.com/photo-1470071459604-3b5ec3a7fe05?q=80&w=1000",
      "https://images.unsplash.com/photo-1441974231531-c6227db76b6e?q=80&w=1000",
      "https://images.unsplash.com/photo-1531366936337-7c912a4589a7?q=80&w=1000",
      "https://images.unsplash.com/photo-1509316975850-ff9c5deb0cd9?q=80&w=1000",
      "https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000"
    ];

    var FALLBACK_DATA = [
      { arabic_text: "بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", translation_text: "Rahmân ve Rahîm olan Allah'ın adıyla.", surah_name_tr: "Fâtiha", verse_id: "1", translation_author: "Diyanet İşleri" },
      { arabic_text: "ٱلْحَمْدُ لِلَّهِ رَبِّ ٱلْعَٰلَمِينَ", translation_text: "Övgü, âlemlerin Rabbi Allah'adır.", surah_name_tr: "Fâtiha", verse_id: "2", translation_author: "Diyanet İşleri" },
      { arabic_text: "ٱلرَّحْمَٰنِ ٱلرَّحِيمِ", translation_text: "O Rahmân'dır ve Rahîm'dir.", surah_name_tr: "Fâtiha", verse_id: "3", translation_author: "Diyanet İşleri" },
      { arabic_text: "مَٰلِكِ يَوْمِ ٱلدِّينِ", translation_text: "Din gününün sahibidir.", surah_name_tr: "Fâtiha", verse_id: "4", translation_author: "Diyanet İşleri" },
      { arabic_text: "إِيَّاكَ نَعْبُدُ وَإِيَّاكَ نَسْتَعِينُ", translation_text: "Ancak sana kulluk eder, ancak senden yardım dileriz.", surah_name_tr: "Fâtiha", verse_id: "5", translation_author: "Diyanet İşleri" }
    ];

    var dataset = [];
    var deck = [];
    var lastBgIndex = -1;
    var feedEl = document.getElementById('feed');
    var isInitialLoaded = false;
    var readCount = parseInt(localStorage.getItem('ayet_read_count') || '0', 10);
    var savedVerses = JSON.parse(localStorage.getItem('ayet_saved_list') || '[]');

    document.getElementById('read-counter').innerText = readCount;
    updateSavedBadge();

    // 2. TIMEOUT SAFETY NET: Ne olursa olsun 1.5 saniye içinde ekranı zorla aç
    var safetyTimer = setTimeout(function() {
      if (!isInitialLoaded) {
        dataset = FALLBACK_DATA;
        startApp();
      }
    }, 1500);

    function escapeHTML(str) {
      if (!str) return '';
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');
    }

    async function loadData() {
      try {
        var response = await fetch(CSV_URL);
        if (!response.ok) throw new Error("veri.csv bulunamadı");
        var csvText = await response.text();

        if (window.Papa) {
          Papa.parse(csvText, {
            header: true,
            skipEmptyLines: 'greedy',
            complete: function(results) {
              var rows = (results.data || []).filter(function(row) {
                return row && Object.values(row).some(function(v) { return v && String(v).trim() !== ''; });
              });
              dataset = (rows && rows.length > 0) ? rows : FALLBACK_DATA;
              startApp();
            },
            error: function() {
              dataset = FALLBACK_DATA;
              startApp();
            }
          });
        } else {
          dataset = FALLBACK_DATA;
          startApp();
        }
      } catch (error) {
        dataset = FALLBACK_DATA;
        startApp();
      }
    }

    function startApp() {
      if (isInitialLoaded) return;
      clearTimeout(safetyTimer);
      
      rebuildDeck();
      var loader = document.getElementById('loading-screen');
      if (loader) loader.remove();

      var count = Math.min(6, dataset.length);
      for (var i = 0; i < count; i++) {
        appendCard();
      }
      isInitialLoaded = true;
    }

    function extractRowData(item) {
      if (!item) return { arabic: '', turkish: '', sure: '', ayet: '', kaynak: '' };

      var arabic = item['arabic_text'] || item['surah_name_ar'] || item['Arapça Yazi'] || item['Arapca'] || '';
      var turkish = item['translation_text'] || item['Türkçe Yazı'] || item['Meal'] || item['Icerik'] || '';
      var sure = item['surah_name_tr'] || item['Sure İsmi'] || item['Sure'] || '';
      var ayet = item['verse_id'] || item['Ayet Numarası'] || item['Ayet'] || '';
      var kaynak = item['translation_author'] || item['Kaynak'] || 'Kur\'an-ı Kerim';

      return { arabic: arabic, turkish: turkish, sure: sure, ayet: ayet, kaynak: kaynak };
    }

    function rebuildDeck() {
      deck = [];
      for (var i = 0; i < dataset.length; i++) deck.push(i);
      for (var j = deck.length - 1; j > 0; j--) {
        var r = Math.floor(Math.random() * (j + 1));
        var temp = deck[j];
        deck[j] = deck[r];
        deck[r] = temp;
      }
    }

    function getNextItem() {
      if (deck.length === 0) rebuildDeck();
      var index = deck.pop();
      return dataset[index];
    }

    function getRandomBg() {
      var nextIndex;
      do {
        nextIndex = Math.floor(Math.random() * BG_IMAGES.length);
      } while (nextIndex === lastBgIndex && BG_IMAGES.length > 1);
      lastBgIndex = nextIndex;
      return BG_IMAGES[nextIndex];
    }

    function appendCard() {
      var rawItem = getNextItem();
      var parsed = extractRowData(rawItem);
      var bgUrl = getRandomBg();
      var sureInfo = parsed.sure ? parsed.sure + ' Suresi' + (parsed.ayet ? ', ' + parsed.ayet + '. Ayet' : '') : parsed.kaynak;
      
      var isSaved = savedVerses.some(function(v) { return v.turkish === parsed.turkish && v.arabic === parsed.arabic; });

      var cardDiv = document.createElement('div');
      cardDiv.className = 'snap-card flex flex-col justify-between p-6 overflow-hidden bg-cover bg-center';
      cardDiv.style.backgroundImage = 'url("' + bgUrl + '")';

      cardDiv.dataset.arabic = parsed.arabic;
      cardDiv.dataset.turkish = parsed.turkish;
      cardDiv.dataset.sureInfo = sureInfo;

      var htmlContent = '' +
        '<div class="absolute inset-0 bg-overlay"></div>' +
        '<div class="absolute right-4 bottom-28 z-30 flex flex-col items-center space-y-6">' +
          '<button onclick="toggleLike(this, event)" class="flex flex-col items-center space-y-1 group focus:outline-none">' +
            '<div class="like-bg p-3 bg-black/40 backdrop-blur-md rounded-full border border-white/10 text-white transition-all">' +
              '<svg class="heart-icon w-6 h-6 fill-none stroke-current stroke-2 transition-colors" viewBox="0 0 24 24">' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12z" />' +
              '</svg>' +
            '</div>' +
            '<span class="text-[10px] font-semibold text-white/80 drop-shadow">Beğen</span>' +
          '</button>' +
          '<button onclick="toggleSave(this, event)" class="flex flex-col items-center space-y-1 group focus:outline-none">' +
            '<div class="save-bg p-3 ' + (isSaved ? 'bg-amber-500/30 border-amber-500/50 text-amber-400' : 'bg-black/40 border-white/10 text-white') + ' backdrop-blur-md rounded-full border transition-all">' +
              '<svg class="bookmark-icon w-6 h-6 ' + (isSaved ? 'fill-amber-400 stroke-amber-400' : 'fill-none stroke-current') + ' stroke-2 transition-colors" viewBox="0 0 24 24">' +
                '<path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />' +
              '</svg>' +
            '</div>' +
            '<span class="text-[10px] font-semibold text-white/80 drop-shadow">Kaydet</span>' +
          '</button>' +
        '</div>' +
        '<div class="relative z-10 h-full w-full flex flex-col justify-between max-w-md mx-auto pointer-events-none">' +
          '<div class="text-center pt-16 pointer-events-auto">' +
            '<span class="bg-black/40 backdrop-blur-md px-4 py-1.5 rounded-full text-xs font-semibold tracking-widest uppercase border border-white/10 text-amber-300">' +
              'Günün Hikmeti' +
            '</span>' +
          '</div>' +
          '<div class="my-auto text-center space-y-6 px-4 pointer-events-auto">' +
            '<p dir="rtl" class="font-arabic text-2xl md:text-3xl text-amber-200 leading-relaxed text-center">' +
              escapeHTML(parsed.arabic) +
            '</p>' +
            '<p class="text-lg md:text-xl font-medium text-white/95 leading-snug text-center">' +
              escapeHTML(parsed.turkish) +
            '</p>' +
          '</div>' +
          '<div class="pb-10 text-center space-y-3 pointer-events-auto">' +
            '<div class="text-sm font-semibold text-white/75 bg-black/30 backdrop-blur-sm py-1.5 px-4 rounded-lg inline-block border border-white/5">' +
              escapeHTML(sureInfo) +
            '</div>' +
            '<p class="text-[10px] text-white/40 tracking-wider">Aşağı kaydırın • Çift tıkla</p>' +
          '</div>' +
        '</div>';

      cardDiv.innerHTML = htmlContent;
      feedEl.appendChild(cardDiv);
    }

    var lastScrollIndex = 0;
    feedEl.addEventListener('scroll', function() {
      if (!isInitialLoaded) return;
      
      var currentIndex = Math.round(feedEl.scrollTop / feedEl.clientHeight);
      if (currentIndex > lastScrollIndex) {
        readCount += (currentIndex - lastScrollIndex);
        lastScrollIndex = currentIndex;
        document.getElementById('read-counter').innerText = readCount;
        localStorage.setItem('ayet_read_count', readCount);
      }

      if (feedEl.scrollTop + feedEl.clientHeight >= feedEl.scrollHeight - (feedEl.clientHeight * 2)) {
        appendCard();
      }
    });

    function toggleLike(btn, e) {
      e.stopPropagation();
      var icon = btn.querySelector('.heart-icon');
      var bg = btn.querySelector('.like-bg');
      var isLiked = icon.getAttribute('fill') === '#ef4444';

      if (!isLiked) {
        icon.setAttribute('fill', '#ef4444');
        icon.setAttribute('stroke', '#ef4444');
        bg.className = "like-bg p-3 bg-red-500/30 backdrop-blur-md rounded-full border border-red-500/50 text-red-400 transition-all";
      } else {
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', 'currentColor');
        bg.className = "like-bg p-3 bg-black/40 backdrop-blur-md rounded-full border border-white/10 text-white transition-all";
      }
    }

    function toggleSave(btn, e) {
      e.stopPropagation();
      var card = btn.closest('.snap-card');
      var arabic = card.dataset.arabic;
      var turkish = card.dataset.turkish;
      var sureInfo = card.dataset.sureInfo;

      var icon = btn.querySelector('.bookmark-icon');
      var bg = btn.querySelector('.save-bg');
      var index = savedVerses.findIndex(function(v) { return v.turkish === turkish && v.arabic === arabic; });

      if (index === -1) {
        savedVerses.push({ arabic: arabic, turkish: turkish, sureInfo: sureInfo });
        icon.setAttribute('fill', '#f59e0b');
        icon.setAttribute('stroke', '#f59e0b');
        bg.className = "save-bg p-3 bg-amber-500/30 backdrop-blur-md rounded-full border border-amber-500/50 text-amber-400 transition-all";
      } else {
        savedVerses.splice(index, 1);
        icon.setAttribute('fill', 'none');
        icon.setAttribute('stroke', 'currentColor');
        bg.className = "save-bg p-3 bg-black/40 backdrop-blur-md rounded-full border border-white/10 text-white transition-all";
      }

      localStorage.setItem('ayet_saved_list', JSON.stringify(savedVerses));
      updateSavedBadge();
    }

    function updateSavedBadge() {
      document.getElementById('saved-count-badge').innerText = savedVerses.length;
    }

    function openSavedModal() {
      renderSavedList();
      var modal = document.getElementById('saved-modal');
      modal.classList.remove('hidden');
      setTimeout(function() {
        modal.classList.remove('opacity-0');
      }, 10);
    }

    function closeSavedModal() {
      var modal = document.getElementById('saved-modal');
      modal.classList.add('opacity-0');
      setTimeout(function() {
        modal.classList.add('hidden');
      }, 300);
    }

    function renderSavedList() {
      var container = document.getElementById('saved-list');
      if (!savedVerses || savedVerses.length === 0) {
        container.innerHTML = '' +
          '<div class="h-64 flex flex-col items-center justify-center text-center text-white/40 space-y-3">' +
            '<svg class="w-12 h-12 stroke-current fill-none stroke-1" viewBox="0 0 24 24">' +
              '<path stroke-linecap="round" stroke-linejoin="round" d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" />' +
            '</svg>' +
            '<p class="text-sm">Henüz kaydedilmiş bir ayet bulunmuyor.</p>' +
          '</div>';
        return;
      }

      var html = '';
      savedVerses.forEach(function(item, idx) {
        html += '' +
          '<div class="p-4 bg-white/5 border border-white/10 rounded-2xl relative space-y-3 text-left">' +
            '<button onclick="removeSavedItem(' + idx + ')" class="absolute top-3 right-3 text-red-400/70 hover:text-red-400 p-1 active:scale-95 transition-all">' +
              '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">' +
                '<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />' +
              '</svg>' +
            '</button>' +
            (item.arabic ? '<p dir="rtl" class="font-arabic text-xl text-amber-200 leading-relaxed pr-6 text-center">' + escapeHTML(item.arabic) + '</p>' : '') +
            '<p class="text-sm font-medium text-white/90 leading-snug text-left">' + escapeHTML(item.turkish) + '</p>' +
            '<div class="text-[11px] font-semibold text-amber-300/80 bg-amber-400/10 px-2.5 py-1 rounded-md inline-block border border-amber-400/20">' +
              escapeHTML(item.sureInfo) +
            '</div>' +
          '</div>';
      });
      container.innerHTML = html;
    }

    function removeSavedItem(index) {
      savedVerses.splice(index, 1);
      localStorage.setItem('ayet_saved_list', JSON.stringify(savedVerses));
      updateSavedBadge();
      renderSavedList();
    }

    var lastTap = 0;
    window.addEventListener('click', function(e) {
      if (e.target.closest('button') || e.target.closest('#saved-modal')) return;
      var currentTime = new Date().getTime();
      var tapLength = currentTime - lastTap;
      if (tapLength < 300 && tapLength > 0) {
        showLikeAnimation(e.clientX, e.clientY);
      }
      lastTap = currentTime;
    });

    function showLikeAnimation(x, y) {
      var container = document.getElementById('anim-container');
      var el = document.createElement('div');
      el.className = 'heart-animation text-amber-300 font-bold text-3xl font-arabic drop-shadow-lg';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.innerText = 'بِسْمِ ٱللَّهِ';
      container.appendChild(el);
      setTimeout(function() { el.remove(); }, 800);
    }

    loadData();
  </script>
</body>
</html>
